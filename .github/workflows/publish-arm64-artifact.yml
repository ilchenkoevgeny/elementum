name: publish ARM64 artifact

on:
  workflow_dispatch:
  push:
    branches:
      - feature/progressive-results

permissions:
  contents: write

concurrency:
  group: publish-arm64-feature-progressive-results
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish linux-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get complete Git history
        run: |
          git fetch --tags --force
          git fetch --prune --unshallow || true

      - name: Prepare Go cache
        run: |
          mkdir -p ~/.cache/go-build ~/.cache/go-cache ~/.cache/go-modcache
          echo "GOPATH=$(readlink -f ~/.cache/go-build)" >> "$GITHUB_ENV"
          echo "GOCACHE=$(readlink -f ~/.cache/go-cache)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(readlink -f ~/.cache/go-modcache)" >> "$GITHUB_ENV"

      - name: Build linux-arm64
        env:
          GO_GCFLAGS: github.com/ElementumOrg/libtorrent-go=-lang=go1.17
        run: |
          make linux-arm64
          make zip PLATFORM=linux-arm64

      - name: Prepare public artifact
        run: |
          set -eux
          ZIP_FILE="$(find build -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"

          mkdir -p public/linux_arm64
          unzip -q "$ZIP_FILE" -d public/linux_arm64

          BINARY="$(find public/linux_arm64 -type f -name elementum | head -n 1)"
          test -n "$BINARY"

          if [ "$BINARY" != "public/linux_arm64/elementum" ]; then
            cp "$BINARY" public/linux_arm64/elementum
          fi

          chmod 0755 public/linux_arm64/elementum
          (
            cd public/linux_arm64
            sha256sum elementum > elementum.sha256
          )

          printf '%s\n' "${GITHUB_SHA}" > public/linux_arm64/source-commit.txt
          file public/linux_arm64/elementum
          cat public/linux_arm64/elementum.sha256

      - name: Publish artifacts branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: artifacts
          publish_dir: ./public
          force_orphan: true
          commit_message: Publish ARM64 build ${{ github.sha }}
